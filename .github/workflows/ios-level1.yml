name: iOS Level 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios-level1.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "core/model/**"
      - "fixtures/lxns_song_list_fallback.json"
      - "iosApp/**"
  push:
    branches:
      - master
      - "codex/**"
      - ios/level1-validation
    paths:
      - ".github/workflows/ios-level1.yml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "core/model/**"
      - "fixtures/lxns_song_list_fallback.json"
      - "iosApp/**"

permissions:
  contents: read

jobs:
  level1:
    name: Shared tests and iOS Simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare build tools
        run: |
          chmod +x gradlew
          mkdir -p build/ios-ci
          java -version 2>&1 | tee build/ios-ci/java-version.log
          xcodebuild -version | tee build/ios-ci/xcode-version.log
          sw_vers | tee build/ios-ci/macos-version.log
          brew install xcodegen
          xcodegen --version | tee build/ios-ci/xcodegen-version.log

      - name: Test shared Kotlin domain
        run: |
          set -o pipefail
          ./gradlew \
            :core:model:compileCommonMainKotlinMetadata \
            :core:model:jvmTest \
            --stacktrace --console=plain \
            2>&1 | tee build/ios-ci/shared-tests.log

      - name: Generate and inspect Xcode project
        run: |
          set -o pipefail
          xcodegen generate --spec iosApp/project.yml --project iosApp \
            2>&1 | tee build/ios-ci/xcodegen.log
          xcodebuild -list -project iosApp/FluentMaiIOS.xcodeproj \
            2>&1 | tee build/ios-ci/xcode-project.log

      - name: Select and boot simulator
        run: |
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json, subprocess
          payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devices = [device for group in payload["devices"].values() for device in group if device.get("isAvailable")]
          iphones = [device for device in devices if device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iPhone simulator")
          print(iphones[0]["udid"])
          PY
          )"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl list devices | tee build/ios-ci/simulators.log

      - name: Test shared Kotlin domain on iOS
        run: |
          set -o pipefail
          ./gradlew \
            :core:model:iosSimulatorArm64Test \
            --stacktrace --console=plain \
            2>&1 | tee build/ios-ci/ios-shared-tests.log

      - name: Build unsigned iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild \
            -project iosApp/FluentMaiIOS.xcodeproj \
            -scheme FluentMaiIOS \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/ios-ci/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build \
            2>&1 | tee build/ios-ci/xcodebuild.log

      - name: Launch smoke test and package artifact
        run: |
          set -euo pipefail
          APP_PATH="$(find build/ios-ci/DerivedData/Build/Products -type d -name FluentMai.app -print -quit)"
          test -n "$APP_PATH"
          xcrun simctl install "$SIMULATOR_UDID" "$APP_PATH"
          xcrun simctl launch "$SIMULATOR_UDID" dev.fluentmai.ios | tee build/ios-ci/launch.log
          sleep 5
          xcrun simctl io "$SIMULATOR_UDID" screenshot build/ios-ci/fluentmai-simulator.png
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" build/ios-ci/FluentMaiIOS-simulator-unsigned.zip

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fluentmai-ios-level1-${{ github.run_number }}
          path: |
            build/ios-ci/*.log
            build/ios-ci/*.png
            build/ios-ci/*.zip
            iosApp/FluentMaiIOS.xcodeproj/project.pbxproj
          if-no-files-found: warn
          retention-days: 14
