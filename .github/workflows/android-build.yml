name: Android build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-build.yml"
      - "app/**"
      - "core/**"
      - "feature/**"
      - "fixtures/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  push:
    branches:
      - master
      - "chore/**"
    paths:
      - ".github/workflows/android-build.yml"
      - "app/**"
      - "core/**"
      - "feature/**"
      - "fixtures/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run tests and assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew test :app:assembleDebug --stacktrace --console=plain

      - name: Upload Android debug evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fluentmai-android-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            **/build/test-results/**/*.xml
          if-no-files-found: warn
          retention-days: 14
